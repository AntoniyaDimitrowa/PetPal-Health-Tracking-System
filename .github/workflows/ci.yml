name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build application
        run: ./gradlew bootJar

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run unit tests
        run: ./gradlew unitTest

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run integration tests
        run: ./gradlew integrationTest

  bdd-tests:
    name: BDD Tests
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - integration-tests
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install Cypress dependencies
        run: npm ci

      - name: Install kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.30.0

      - name: Install kind
        run: |
          curl -Lo kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          chmod +x kind
          sudo mv kind /usr/local/bin/kind

      - name: Create kind cluster
        run: kind create cluster --name petpal

      - name: Build backend image
        run: docker build -t petpal-backend:latest .

      - name: Load backend image into kind
        run: kind load docker-image petpal-backend:latest --name petpal

      - name: Apply test namespace and database manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/secret.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/mysql-test.yaml

      - name: Wait for MySQL
        run: kubectl wait --for=condition=available deployment/mysql-test -n petpal --timeout=300s

      - name: Apply test backend manifest
        run: kubectl apply -f k8s/petpal-backend-test.yaml

      - name: Wait for test backend
        run: kubectl wait --for=condition=available deployment/petpal-backend-test -n petpal --timeout=300s

      - name: Seed test catalog data
        run: |
          MYSQL_POD=$(kubectl get pods -n petpal -l app=mysql-test -o jsonpath='{.items[0].metadata.name}')

          MYSQL_READY=false
          for attempt in $(seq 1 30); do
            if kubectl exec -n petpal "$MYSQL_POD" -- env MYSQL_PWD=changeme-test mysql --protocol=tcp -h 127.0.0.1 -uroot -e "SELECT 1" petpal-test-db >/dev/null 2>&1; then
              MYSQL_READY=true
              break
            fi

            sleep 5
          done

          if [ "$MYSQL_READY" != "true" ]; then
            echo "MySQL test database did not become ready in time"
            exit 1
          fi

          kubectl exec -i -n petpal "$MYSQL_POD" -- env MYSQL_PWD=changeme-test mysql --protocol=tcp -h 127.0.0.1 -uroot petpal-test-db <<'SQL'
          INSERT INTO mood (name, emoji) VALUES
            ('Happy', ':)'),
            ('Playful', ':D');

          INSERT INTO breed (name, description, normal_mood_id, minimum_exercise_per_day) VALUES
            ('German Shepherd', 'Intelligent, loyal working dog.', 1, 2.0),
            ('Golden Retriever', 'Friendly, family-oriented dog.', 2, 1.5),
            ('Beagle', 'Curious, friendly, great scent hound.', 1, 1.0);

          INSERT INTO breed_health_info (
            breed_id,
            user_id,
            age_range_start,
            age_range_end,
            normal_food_intake,
            normal_water_intake,
            weight_range_min,
            weight_range_max
          ) VALUES
            (2, NULL, 1, 3, 300, 1.2, 20, 28);

          INSERT INTO vaccination (name, type, period_vac) VALUES
            ('Rabies', 'FOR_ADULT', 16),
            ('Bordetella', 'FOR_PUPPY', 12);
          SQL

      - name: Run BDD tests
        env:
          CYPRESS_API_BASE_URL: http://127.0.0.1:8081/backend
        run: |
          kubectl port-forward -n petpal service/petpal-backend-test-service 8081:8080 >/tmp/petpal-port-forward.log 2>&1 &
          PF_PID=$!
          trap 'kill $PF_PID || true' EXIT
          for attempt in $(seq 1 30); do
            STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8081/backend/breeds || true)
            if [ "$STATUS_CODE" = "401" ]; then
              break
            fi
            sleep 5
          done

          if [ "$STATUS_CODE" != "401" ]; then
            echo "Backend test service did not become ready in time"
            exit 1
          fi

          npm run bdd:test

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: bdd-tests
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/petpal-backend
      KUBE_NAMESPACE: petpal

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.30.0

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          if [ -z "$KUBE_CONFIG_DATA" ]; then
            echo "KUBE_CONFIG_DATA is not set"
            exit 1
          fi

          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG_DATA" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Apply namespace and secrets
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          for required_var in DB_PASSWORD JWT_SECRET WEATHER_API_KEY OPENROUTER_API_KEY; do
            if [ -z "${!required_var}" ]; then
              echo "$required_var is not set"
              exit 1
            fi
          done

          kubectl apply -f k8s/namespace.yaml

          kubectl create secret generic petpal-secret \
            -n "$KUBE_NAMESPACE" \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=WEATHER_API_KEY="$WEATHER_API_KEY" \
            --from-literal=OPENROUTER_API_KEY="$OPENROUTER_API_KEY" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply database and config manifests
        run: |
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/mysql-pvc.yaml
          kubectl apply -f k8s/mysql-service.yaml
          kubectl apply -f k8s/mysql-deployment.yaml
          kubectl rollout status deployment/mysql -n "$KUBE_NAMESPACE" --timeout=300s

      - name: Render backend deployment manifest
        run: |
          mkdir -p /tmp/petpal-manifests
          sed "s|image: petpal-backend:latest|image: ${IMAGE_NAME}:${GITHUB_SHA}|g" k8s/backend-deployment.yaml > /tmp/petpal-manifests/backend-deployment.yaml

      - name: Apply application manifests
        run: |
          kubectl apply -f k8s/backend-service.yaml
          kubectl apply -f /tmp/petpal-manifests/backend-deployment.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl rollout status deployment/petpal-backend -n "$KUBE_NAMESPACE" --timeout=300s

  load-tests:
    name: Load Tests
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.30.0

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
        run: |
          if [ -z "$KUBE_CONFIG_DATA" ]; then
            echo "KUBE_CONFIG_DATA is not set"
            exit 1
          fi

          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG_DATA" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Apply load test scripts
        run: kubectl apply -f k8s/loadtest-script-configmap.yaml

      - name: Run catalog load test
        run: |
          kubectl delete job petpal-loadtest-catalog -n petpal --ignore-not-found
          kubectl apply -f k8s/loadtest-job-prod-catalog.yaml
          kubectl wait --for=condition=complete job/petpal-loadtest-catalog -n petpal --timeout=900s
          kubectl logs -n petpal job/petpal-loadtest-catalog

      - name: Run pet health load test
        run: |
          kubectl delete job petpal-loadtest-pet-health -n petpal --ignore-not-found
          kubectl apply -f k8s/loadtest-job-prod-pet-health.yaml
          kubectl wait --for=condition=complete job/petpal-loadtest-pet-health -n petpal --timeout=900s
          kubectl logs -n petpal job/petpal-loadtest-pet-health
