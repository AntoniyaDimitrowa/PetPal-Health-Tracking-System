services:
  petpal-db:
    image: mysql:latest
    container_name: petpal-db
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: petpal-db
    ports:
      - "3390:3306"
    volumes:
      - petpal-data:/var/lib/mysql
    networks:
      - petpal-network

  petPal-app:
    image: semester3-individualproject-petpal:latest
    container_name: petpal-be
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8090:8080"

    depends_on:
      - petpal-db

    networks:
      - petpal-network

    environment:
      JAVA_OPTS: ""

    restart: unless-stopped

networks:
  petpal-network:
    driver: bridge

volumes:
  petpal-data: