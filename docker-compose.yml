services:
  petpal-db:
    image: mysql:latest
    container_name: petpal-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-change-me-local-db-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-petpal-db}
    ports:
      - "3390:3306"
    volumes:
      - petpal-data:/var/lib/mysql
    networks:
      - petpal-network

  petPal-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: semester3-individualproject-petpal:latest
    container_name: petpal-be

    ports:
      - "8090:8080"

    depends_on:
      - petpal-db

    networks:
      - petpal-network

    environment:
      JAVA_OPTS: ""
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://petpal-db:3306/petpal-db}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-change-me-local-db-password}
      JWT_SECRET: ${JWT_SECRET:-change-me-local-jwt-secret}
      WEATHER_API_URL: ${WEATHER_API_URL:-https://api.openweathermap.org/data/2.5/weather}
      WEATHER_API_KEY: ${WEATHER_API_KEY:-change-me-local-weather-key}
      OPENROUTER_API_URL: ${OPENROUTER_API_URL:-https://openrouter.ai/api/v1/completions}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-change-me-local-openrouter-key}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-meta-llama/llama-3.2-1b-instruct:free}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://petpal.local,http://localhost:5173,http://localhost:3000,http://localhost:80,http://127.0.0.1:5173,http://127.0.0.1:3000}

    restart: unless-stopped

  petpal-fe:
    build:
      context: ../PetPal-Health-Tracking-System-FrontEnd/Pet Care Front End/petCareFrontEnd
      dockerfile: Dockerfile
    container_name: petpal-fe
    image: semester3-individualproject-petpal-petpal-fe:latest  # Tag with 'latest'
    ports:
      - "3000:80"
    depends_on:
      - petPal-app
    networks:
      - petpal-network

networks:
  petpal-network:
    driver: bridge

volumes:
  petpal-data:
