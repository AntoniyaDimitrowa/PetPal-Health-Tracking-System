apiVersion: v1
kind: Service
metadata:
  name: mysql-test-service
  namespace: petpal
spec:
  ports:
    - port: 3306
      targetPort: 3306
  selector:
    app: mysql-test
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-test
  namespace: petpal
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mysql-test
  template:
    metadata:
      labels:
        app: mysql-test
    spec:
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: mysql-test
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: petpal-secret
                  key: DB_PASSWORD_TEST
            - name: MYSQL_DATABASE
              value: petpal-test-db
          ports:
            - containerPort: 3306
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --silent
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: mysql-test-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-test-storage
          persistentVolumeClaim:
            claimName: mysql-test-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-test-pvc
  namespace: petpal
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
