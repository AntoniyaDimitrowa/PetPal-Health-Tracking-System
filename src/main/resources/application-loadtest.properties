# Use the test database instead of production
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-test-service:3306/petpal-test-db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-me-local-test-password}

# Keep schema management identical
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true

# Logging & JPA behavior
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.connection.autocommit=false
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# API keys (injected via env variables)
weather.api.url=${WEATHER_API_URL:https://api.openweathermap.org/data/2.5/weather}
weather.api.key=${WEATHER_API_KEY:change-me-local-weather-key}

openrouter.api.url=${OPENROUTER_API_URL:https://openrouter.ai/api/v1/completions}
openrouter.api.key=${OPENROUTER_API_KEY:change-me-local-openrouter-key}
openrouter.model=${OPENROUTER_MODEL:meta-llama/llama-3.2-1b-instruct:free}

# Same backend context path
server.servlet.context-path=/backend
