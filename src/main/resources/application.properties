spring.application.name=PetPal
spring.profiles.active=default
spring.jpa.hibernate.ddl-auto=none
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://petpal-db:3306/petpal-db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-me-local-db-password}
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.connection.autocommit=false
spring.flyway.enabled=true
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://petpal.local,http://localhost:5173,http://localhost:3000,http://localhost:80,http://127.0.0.1:5173,http://127.0.0.1:3000}
jwt.secret=${JWT_SECRET:change-me-local-jwt-secret}

weather.api.url=${WEATHER_API_URL:https://api.openweathermap.org/data/2.5/weather}
weather.api.key=${WEATHER_API_KEY:change-me-local-weather-key}

openrouter.api.url=${OPENROUTER_API_URL:https://openrouter.ai/api/v1/completions}
openrouter.api.key=${OPENROUTER_API_KEY:change-me-local-openrouter-key}
openrouter.model=${OPENROUTER_MODEL:meta-llama/llama-3.2-1b-instruct:free}

server.servlet.context-path=/backend
